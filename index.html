<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dice Roller REST API Test</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        button {
            margin: 5px;
            padding: 10px 15px;
            cursor: pointer;
        }

        pre {
            background: #f4f4f4;
            padding: 20px;
            border: 1px solid #ccc;
        }

    </style>

</head>

<body>

    <h1>Dice Roller REST API</h1>

    <p>
        This page tests the RESTful APIs provided by the
        Node.js server.
    </p>


    <button onclick="wakeServer()">
        Wake Server
    </button>

    <button onclick="testAPI('/api')">
        API Information
    </button>

    <button onclick="testAPI('/roll/d4')">
        Test D4
    </button>

    <button onclick="testAPI('/roll/d6')">
        Test D6
    </button>

    <button onclick="testAPI('/roll/d8')">
        Test D8
    </button>

    <button onclick="testAPI('/roll/d10')">
        Test D10
    </button>

    <button onclick="testAPI('/roll/d12')">
        Test D12
    </button>

    <button onclick="testAPI('/roll/d20')">
        Test D20
    </button>

    <button onclick="testAPI('/roll/d100')">
        Test D100
    </button>


    <h2>API Response</h2>

    <pre id="result">No API request made yet.</pre>


    <script>

        async function testAPI(endpoint) {

            try {

                const response = await fetch(endpoint);

                if (!response.ok) {

                    throw new Error(
                        "HTTP Error: " + response.status
                    );

                }

                const data = await response.json();

                document.getElementById("result").textContent =
                    JSON.stringify(data, null, 2);

            }

            catch (error) {

                document.getElementById("result").textContent =
                    "ERROR: " + error.message;

            }

        }


        async function wakeServer() {

            await testAPI("/wake");

        }

    </script>

</body>

</html>
